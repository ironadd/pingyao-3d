<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#3a2a22">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2212%22 fill=%22%23b5241b%22/%3E%3Cpath d=%22M8 30 Q32 8 56 30 L50 30 Q32 18 14 30Z%22 fill=%22%23ffd36b%22/%3E%3Crect x=%2216%22 y=%2232%22 width=%2232%22 height=%2220%22 fill=%22%23ffe9b0%22/%3E%3C/svg%3E">
<title>平遥古城 · 3D 龟城</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#1a1410;font-family:-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#fff;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0}
#app canvas{display:block;width:100%;height:100%;touch-action:none}
.glass{background:rgba(52,38,30,.66);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(230,194,122,.45);box-shadow:0 4px 18px rgba(0,0,0,.25)}
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}
#title{pointer-events:auto;padding:8px 14px 8px 12px;border-radius:14px;display:flex;align-items:center;gap:10px}
#title .seal{width:34px;height:34px;border-radius:8px;background:#b5241b;border:2px solid #e6c27a;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:#ffe9b0;letter-spacing:-1px;line-height:1}
#title h1{margin:0;font-size:21px;letter-spacing:4px;color:#ffe3a3;font-weight:700;line-height:1.1}
#title p{margin:2px 0 0;font-size:11px;color:#f3d9b0;opacity:.85;letter-spacing:1px}
#tools{display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.tbtn{width:44px;height:44px;border-radius:12px;color:#ffe3a3;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;line-height:1.15;padding:0}
.tbtn b{font-size:17px;font-weight:400}
.tbtn.on{background:rgba(181,36,27,.88);border-color:#ffd77a}
#bottom{position:fixed;left:0;right:0;bottom:0;padding:0 0 calc(env(safe-area-inset-bottom) + 10px);pointer-events:none}
#chips{display:flex;gap:8px;overflow-x:auto;padding:4px 12px 2px;scrollbar-width:none;pointer-events:auto;touch-action:pan-x}
#chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 15px;border-radius:20px;font-size:14px;color:#ffe9c4;cursor:pointer;white-space:nowrap;letter-spacing:1px}
.chip.active{background:rgba(181,36,27,.92);border-color:#ffd77a;color:#fff}
#card{pointer-events:auto;margin:0 12px 10px;border-radius:16px;padding:14px 16px 14px;transform:translateY(20px);opacity:0;transition:.28s ease;visibility:hidden;max-height:42vh;overflow-y:auto;touch-action:pan-y}
#card.show{transform:none;opacity:1;visibility:visible}
#card h2{margin:0 0 2px;font-size:19px;color:#ffe3a3;letter-spacing:2px}
#card .sub{font-size:12px;color:#f0c98a;margin-bottom:8px}
#card .txt{font-size:14px;line-height:1.7;color:#fff4e6;text-align:justify}
#card .x{position:absolute;right:10px;top:8px;width:30px;height:30px;border-radius:15px;border:none;background:rgba(255,255,255,.12);color:#ffe3a3;font-size:18px;line-height:30px;cursor:pointer}
#card{position:relative}
#card .go{margin-top:10px;display:inline-block;padding:6px 14px;border-radius:14px;background:#b5241b;color:#fff;font-size:13px;border:1px solid #e6c27a;cursor:pointer}
#hint{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 78px);transform:translateX(-50%);padding:7px 14px;border-radius:16px;font-size:12px;color:#ffeccc;white-space:nowrap;transition:opacity .8s;pointer-events:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;padding:3px 8px;border-radius:10px;font-size:12px;color:#fff;background:rgba(60,40,30,.8);border:1px solid rgba(255,215,122,.7);white-space:nowrap;will-change:transform;display:none;letter-spacing:1px}
.lbl:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-1px;width:2px;height:6px;background:rgba(255,215,122,.8)}
#loading{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#5a4434,#1c140f 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:50;transition:opacity .7s}
#loading .ring{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,215,122,.25);border-top-color:#ffd77a;animation:sp 1s linear infinite}
#loading .t{margin-top:18px;font-size:16px;letter-spacing:4px;color:#ffe3a3}
#loading .s{margin-top:8px;font-size:12px;color:#e9c79a;opacity:.8}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>

<div id="labels"></div>
<div id="top">

  </div>
</div>

</div>
